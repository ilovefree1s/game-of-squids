<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Squids</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <header>
    <h1 id="title">Game of Squids</h1>
    <button id="back" hidden>← Menu</button>
  </header>

  <main>
    <section id="menu" class="grid"></section>
    <section id="stage" hidden>
      <div id="hud"><span id="game-name"></span><span>Score: <b id="score">0</b></span></div>
      <div id="game"></div>
    </section>
  </main>

  <div id="version"></div>

  <!-- Shared code: loads first -->
  <script src="shared/version.js"></script>
  <script src="shared/lib/three.min.js"></script>
  <script src="shared/lib/GLTFLoader.js"></script>
  <script src="shared/lib/SkeletonUtils.js"></script>
  <script src="shared/lib/supabase.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/net.js"></script>
  <script src="shared/input.js"></script>
  <script src="shared/models.js"></script>
  <script src="shared/hub.js"></script>

  <!-- Mini-games: add ONE line per game, each on its own line (keeps merges clean) -->
  <script src="minigames/snake/snake.js"></script>
  <script src="minigames/reaction/reaction.js"></script>
  <script src="minigames/glass-bridge/glass-bridge.js"></script>

  <!-- Start the menu: keep this last -->
  <script>Hub.showMenu();</script>
</body>
</html>
